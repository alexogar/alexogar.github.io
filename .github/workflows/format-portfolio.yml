name: One-off portfolio formatter

on:
  push:
    branches:
      - feat/public-profile-case-studies-2026
    paths:
      - .github/workflows/format-portfolio.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/public-profile-case-studies-2026
      - uses: pnpm/action-setup@v6
        with:
          standalone: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/pages/index.astro 'src/pages/work/[slug].astro'
      - name: Commit formatted files to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/index.astro 'src/pages/work/[slug].astro'
          if ! git diff --cached --quiet; then
            git commit -m 'style: format portfolio case studies'
            git push origin HEAD:feat/public-profile-case-studies-2026
          fi
